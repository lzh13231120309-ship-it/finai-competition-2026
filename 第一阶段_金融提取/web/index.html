<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金融文件提取工作台</title><link rel="stylesheet" href="static/style.css"></head>
<body><header><div><span class="brand">FINAI / 第一阶段</span><h1>金融文件提取工作台</h1><p>原始材料 → 结构化字段 → 对照证据 → 人工复核</p></div><span class="badge">仅保存在本机</span></header>
<main><section class="panel upload"><div><h2>开始提取</h2><p>保留原数字、单位、报告期和出处。结果是待核验候选，未经复核不能直接作为研究结论。</p></div><form id="upload"><label>选择文件<input name="file" type="file" accept=".pdf,.docx,.xlsx,.png,.jpg,.jpeg,.csv,.tsv,.txt,.md" required></label><div class="options"><label>处理方式<select id="mode"><option value="auto:auto">智能选择 · 自动检查文字层与识别方式</option><option value="flash:txt">文字 PDF / Office · 快速保留文字层</option><option value="basic:ocr">扫描件 / 图片 · 本地 OCR</option><option value="standard:auto">复杂表格 · 本地高质量模型</option></select></label><label>PDF 页码（留空处理全部）<input name="pages" placeholder="如 1-3 或 1,4,6-8"></label><button type="submit">提取并保存</button></div><p class="hint">本地模型已部署。可先处理 1—3 页比较效果；Office、CSV和文本采用原生解析。</p></form><p id="message" role="status"></p></section>
<div class="layout"><aside class="panel"><h2>本地任务</h2><button id="refresh" class="secondary">刷新列表</button><div id="jobs"></div></aside><section class="panel result"><div class="result-head"><div><h2 id="result-title">选择一个任务查看结果</h2><p id="result-status">支持 PDF、DOCX、XLSX 和图片，单文件不超过 70MB。</p></div><div id="downloads"></div></div><div id="summary"></div><nav id="tabs" hidden><button data-tab="fields" class="active">金融字段</button><button data-tab="tables">原始表格</button><button data-tab="text">全文内容</button><button data-tab="audit">复核记录</button></nav><div id="content"><div class="empty">从上传一份材料开始，或选择左侧已经完成的任务。</div></div></section></div></main><footer>MinerU 提供文档解析；FINAI 提供金融结构整理和证据复核。工作台不自动上传 GitHub。</footer><script src="static/app.js"></script></body></html>
